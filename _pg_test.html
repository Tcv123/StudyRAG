<!doctype html><html><head><meta charset="utf-8"><title>pg test</title>
<script src="predicted-grade.js"></script></head>
<body style="font-family:sans-serif;padding:20px;--muted:#6B7280;background:#fff;">
<div style="max-width:280px;">
<h4>On track (target C)</h4>
<div id="a"></div>
<h4>Below target (target A*)</h4>
<div id="b"></div>
<h4>No target</h4>
<div id="c"></div>
</div>
<script>
const good = window.computePredictedGrade({ level:'a-level', totalTopics:10,
  topicRows:[{rag_status:'green'},{rag_status:'green'},{rag_status:'amber'}],
  practiceRows:[{earned:40,total_marks:50},{earned:8,total_marks:10}] });
const bad = {grade:'U',masteryPct:4,confidence:'low',ragScore:4,practiceScore:null};
document.getElementById('a').innerHTML = window.renderPredictedGradeBadge(good,{level:'a-level',target:'C'});
document.getElementById('b').innerHTML = window.renderPredictedGradeBadge(bad,{level:'a-level',target:'A*'});
document.getElementById('c').innerHTML = window.renderPredictedGradeBadge(good,{level:'a-level'});
</script></body></html>
