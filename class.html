<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>RAG Learning — Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="classes-nav.js"></script>
  <script src="subjects-config.js"></script>
  <script src="practice-bank-config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font-body, 'DM Sans', sans-serif);
      font-size: 15px; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    /* ── APP SHELL (matches Dashboard.html / teacher.html) ── */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w, 232px); background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 24px 0;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
      box-shadow: 2px 0 16px rgba(37,99,235,0.08);
      overflow-y: auto;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px; text-decoration: none; color: inherit; }
    .logo-img { width: 24px; height: 24px; flex-shrink: 0; }
    .logo-text { font-family: var(--font-display); font-size: 18px; color: var(--text); }
    .nav-section { padding: 0 12px; margin-bottom: 8px; }
    .nav-label { font-size: 10px; font-weight: 600; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.1em; padding: 0 8px; margin-bottom: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; font-size: 13px;
      color: var(--muted); cursor: pointer; transition: all 0.12s; text-decoration: none;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent-dark); font-weight: 500; }
    .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-item.stacked { align-items: flex-start; }
    .nav-item .nav-stack { min-width: 0; }
    .nav-item .nav-main { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item .nav-sub { display: block; font-size: 11px; color: var(--muted2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pro-tag { margin-left: auto; font-size: 10px; color: var(--amber); font-weight: 600; }

    .sidebar-bottom { margin-top: auto; padding: 16px 16px 0; border-top: 1px solid var(--border); }
    .user-chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; background: var(--surface2); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--muted); font-size: 13px; transition: all 0.12s; }
    .logout-btn:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }

    .main { flex: 1; margin-left: var(--sidebar-w, 232px); padding: 28px 32px 64px; min-width: 0; }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--muted); text-decoration: none;
      padding: 6px 10px; border-radius: 8px; margin-bottom: 18px;
      transition: all 0.15s;
    }
    .back:hover { background: var(--accent-dim); color: var(--accent-dark); }

    .mobile-menu-btn {
      display: none; width: 36px; height: 36px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      align-items: center; justify-content: center; cursor: pointer;
      font-size: 18px; box-shadow: 0 1px 4px rgba(37,99,235,0.1);
      margin-bottom: 14px;
    }
    .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 99; }
    .mobile-overlay.active { display: block; }

    /* ── HEADER ── */
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
    .head-emoji { font-size: 30px; line-height: 1; margin-bottom: 8px; }
    .head h1 { font-family: var(--font-display); font-size: 28px; letter-spacing: -0.02em; margin-bottom: 4px; }
    .head-meta { font-size: 13px; color: var(--muted); }
    .code-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px; text-align: center;
    }
    .code-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); margin-bottom: 6px; }
    .code-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 22px; font-weight: 600; letter-spacing: 0.16em; color: var(--accent-dark);
    }

    /* ── TABS ── */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab {
      padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer; border: none; background: none; font-family: inherit;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); font-weight: 600; }

    /* ── CARDS / STATS ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
    .card h2 { font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .stat-value { font-family: var(--font-display); font-size: 26px; color: var(--text); line-height: 1.1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 5px; }

    /* ── TOPIC BARS ── */
    .topic-row {
      display: grid; grid-template-columns: 1fr 180px 66px;
      align-items: center; gap: 14px;
      padding: 10px 8px; border-radius: 9px; cursor: pointer; transition: background 0.12s;
    }
    .topic-row:hover { background: var(--surface2); }
    .topic-row.head-row { cursor: default; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted2); font-weight: 600; }
    .topic-row.head-row:hover { background: none; }
    .topic-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topic-name .tid { color: var(--muted2); font-size: 11px; margin-right: 6px; }
    .bar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: var(--surface3); }
    .bar span { display: block; height: 100%; }
    .bar .b-red   { background: var(--red); }
    .bar .b-amber { background: var(--amber); }
    .bar .b-green { background: var(--green); }
    .bar .b-none  { background: var(--surface3); }
    .topic-count { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }

    /* ── GRID ── */
    .grid-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    table.grid { border-collapse: separate; border-spacing: 0; font-size: 12px; }
    table.grid th, table.grid td { padding: 0; }
    table.grid thead th {
      position: sticky; top: 0; z-index: 2; background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 600; font-size: 11px; color: var(--muted);
      height: 74px; width: 34px; min-width: 34px;
      vertical-align: bottom; padding-bottom: 8px;
    }
    table.grid thead th.corner {
      left: 0; z-index: 3; width: 240px; min-width: 240px;
      text-align: left; padding: 0 12px 8px;
      vertical-align: bottom; text-transform: uppercase; letter-spacing: 0.07em;
    }
    .stu-head { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; max-height: 62px; cursor: pointer; }
    .stu-head:hover { color: var(--accent-dark); }
    table.grid td.tname {
      position: sticky; left: 0; z-index: 1; background: var(--surface);
      width: 240px; min-width: 240px; max-width: 240px;
      padding: 0 12px; border-right: 1px solid var(--border);
      font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    table.grid tbody tr { height: 30px; }
    table.grid tbody tr:hover td.tname { background: var(--surface2); color: var(--accent-dark); }
    .cell { display: block; width: 16px; height: 16px; border-radius: 4px; margin: 0 auto; }
    /* Solid = measured from practice scores. Hollow = the student's own
       rating with no evidence behind it. Grey = nothing attempted. */
    .cell.m-red   { background: var(--red); }
    .cell.m-amber { background: var(--amber); }
    .cell.m-green { background: var(--green); }
    .cell.s-red   { border: 2px solid var(--red);   background: transparent; }
    .cell.s-amber { border: 2px solid var(--amber); background: transparent; }
    .cell.s-green { border: 2px solid var(--green); background: transparent; }
    .cell.none    { background: var(--surface3); opacity: 0.55; }

    .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--muted); }
    .legend-item { display: flex; align-items: center; gap: 7px; }

    /* ── ROSTER ── */
    .roster-row {
      display: grid; grid-template-columns: 1fr 130px 110px 90px;
      align-items: center; gap: 12px; padding: 11px 8px;
      border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .roster-row:last-child { border-bottom: none; }
    .roster-row.head-row { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted2); font-weight: 600; }
    .flag {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 20px;
      background: var(--amber-bg, rgba(217,119,6,0.1)); color: var(--amber-text, #B45309);
    }
    .flag.ok { background: var(--surface2); color: var(--muted2); font-weight: 400; }
    .link-btn { background: none; border: none; font-family: inherit; font-size: 12px; color: var(--muted2); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .link-btn:hover { color: var(--red); background: var(--red-bg); }

    /* ── STUDENT / TOPIC DETAIL ── */
    .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      font-size: 12px; padding: 5px 11px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    }
    .chip.red   { background: var(--red-bg);   border-color: var(--red-border);   color: var(--red-text); }
    .chip.amber { background: var(--amber-bg, rgba(217,119,6,0.1)); border-color: var(--amber-border, rgba(217,119,6,0.25)); color: var(--amber-text, #B45309); }
    .chip.green { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }

    .btn { border: none; border-radius: 9px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; padding: 10px 16px; transition: all 0.15s; }
    .btn-outline { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent-dark); }
    .btn-danger { background: var(--surface); color: var(--red-text); border: 1px solid var(--red-border); }
    .btn-danger:hover { background: var(--red-bg); }

    .empty { text-align: center; padding: 44px 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .empty .big { font-size: 32px; margin-bottom: 12px; }
    .empty b { color: var(--text); }

    .muted-note { font-size: 12px; color: var(--muted2); margin-top: 12px; line-height: 1.5; }

    /* Below tablet the grid is unusable — the ranked list is the useful part
       anyway, so hide the matrix rather than shrink it into noise. */
    @media (max-width: 768px) {
      .mobile-menu-btn { display: flex; }
      .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; z-index: 100; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 16px 14px 48px; }
    }
    @media (max-width: 820px) {
      .grid-scroll, .tab[data-tab="grid"] { display: none; }
      .topic-row { grid-template-columns: 1fr 90px; }
      .topic-row .topic-count { display: none; }
      .roster-row { grid-template-columns: 1fr 90px; }
      .roster-row > :nth-child(3), .roster-row > :nth-child(4) { display: none; }
    }
  </style>
  <link rel="stylesheet" href="responsive.css">
  <script src="theme.js"></script>
</head>
<body>
<div class="app">
  <!-- Sidebar is rendered once we know whether the viewer is the teacher or
       a member — the two need completely different navigation. -->
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.add('open');document.querySelector('.mobile-overlay').classList.add('active');">☰</div>
    <div id="root">
      <div class="empty"><div class="big">⏳</div>Loading…</div>
    </div>
  </main>
</div>

<div class="mobile-overlay" onclick="document.querySelector('.sidebar').classList.remove('open');this.classList.remove('active');"></div>

<script>
const CLASS_ID = new URLSearchParams(location.search).get('id');

let me = null, profile = null, klass = null, isTeacher = false;
let roster = [], heatmap = [], topics = [];
let assignments = [], assignProgress = [];
let tab = 'overview';

/* ═══ Topic list ═══════════════════════════════════════════════════════
 *
 * The bank loaders in practice-bank-config.js resolve level from
 * localStorage.cached_level — the VIEWER's level. That is right on a student
 * page and wrong here: a teacher's own cached level says nothing about the
 * class they are looking at, and would silently draw GCSE topics for an
 * A-Level class. So resolve the bundle against the class's level instead.
 * ════════════════════════════════════════════════════════════════════════ */
function levelSuffix(level) {
  return (level === 'a-level' || level === 'as') ? 'alevel' : 'gcse';
}

function lookupForLevel(map, subject, board, level) {
  const base   = `${subject}_${board}`;
  const keyed  = map[`${base}|${levelSuffix(level)}`];
  return keyed !== undefined ? keyed : map[base];
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

async function loadTopics(subject, board, level) {
  const files = lookupForLevel(window.PRACTICE_BUNDLE_MAP || {}, subject, board, level);
  if (!files) return [];
  try {
    for (const f of files) await loadScriptOnce(f);
  } catch { return []; }

  const getter = lookupForLevel(window.PRACTICE_GLOBAL_MAP || {}, subject, board, level);
  const bank   = typeof getter === 'function' ? getter() : null;
  if (!bank) return [];

  // Two bank shapes are in use: { id: { name, questions } } and { id: [...] }.
  return Object.keys(bank).map(id => ({
    id,
    name: (!Array.isArray(bank[id]) && bank[id]?.name) ? bank[id].name : id
  }));
}

/* ═══ Boot ════════════════════════════════════════════════════════════ */
(async () => {
  if (!CLASS_ID) { fail('No class specified.'); return; }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { location = 'auth/login.html'; return; }
  me = user;

  const { data: p } = await supabaseClient
    .from('profiles').select('first_name, last_name, account_type')
    .eq('id', user.id).maybeSingle();
  profile = p;

  // RLS gives a teacher their own classes and nobody else's, so a row coming
  // back here IS the authorisation check — no separate ownership test needed.
  const { data: owned } = await supabaseClient
    .from('classes').select('*').eq('id', CLASS_ID).maybeSingle();

  if (owned) {
    isTeacher = true;
    klass = owned;
    await loadTeacher();
  } else {
    // Not the owner — the only other legitimate viewer is a member. Students
    // cannot read `classes`, so my_classes() is how they resolve it.
    const { data: mine } = await supabaseClient.rpc('my_classes');
    klass = (mine || []).find(c => c.class_id === CLASS_ID);
    if (!klass) { fail("You don't have access to this class."); return; }
    await loadStudent();
  }
})();

function fail(message) {
  renderSidebar([]);
  document.getElementById('root').innerHTML =
    `<a class="back" href="Dashboard.html">← Back</a>
     <div class="empty"><div class="big">🔒</div><b>${esc(message)}</b></div>`;
}

/* ═══ Sidebar ═════════════════════════════════════════════════════════
 *
 * Mirrors Dashboard.html for students and teacher.html for teachers, so
 * this page sits inside the app rather than beside it. `classList` is the
 * other classes the viewer can reach — their own memberships, or the classes
 * they teach.
 * ════════════════════════════════════════════════════════════════════════ */
function renderSidebar(classList) {
  const fn = profile?.first_name || '', ln = profile?.last_name || '';
  const initials = ((fn[0] || '') + (ln[0] || '')).toUpperCase() || '?';
  const home = isTeacher ? 'teacher.html' : 'Dashboard.html';

  const others = (classList || []).map(c => `
    <a class="nav-item stacked ${c.id === CLASS_ID ? 'active' : ''}" href="class.html?id=${encodeURIComponent(c.id)}">
      <span class="nav-icon">${esc(subjEmoji(c.subject))}</span>
      <span class="nav-stack">
        <span class="nav-main">${esc(c.name)}</span>
        <span class="nav-sub">${esc(c.sub || '')}</span>
      </span>
    </a>`).join('');

  const studentMenu = `
    <div class="nav-section">
      <div class="nav-label">Menu</div>
      <a class="nav-item" href="Dashboard.html"><span class="nav-icon">⊞</span> Dashboard</a>
      <a class="nav-item" href="breakdown.html"><span class="nav-icon">📊</span> Breakdown</a>
      <a class="nav-item" href="notes.html"><span class="nav-icon">📄</span> Notes</a>
      <a class="nav-item" href="Dashboard.html#diagnostic"><span class="nav-icon">🚦</span> Diagnostic</a>
      <a class="nav-item" href="medals.html"><span class="nav-icon">🏅</span> Medals</a>
      <a class="nav-item" href="practice.html"><span class="nav-icon">✦</span> Practice questions</a>
    </div>

    <div class="nav-section" style="margin-top:8px;">
      <div class="nav-label">Premium</div>
      <a class="nav-item" href="pricing-app.html" style="opacity:0.65;"><span class="nav-icon">📆</span> Revision timetable <span class="pro-tag">PRO</span></a>
      <a class="nav-item" href="pricing-app.html" style="opacity:0.65;"><span class="nav-icon">🃏</span> Flashcards <span class="pro-tag">PRO</span></a>
      <a class="nav-item" href="pricing-app.html" style="opacity:0.65;"><span class="nav-icon">📜</span> Test history <span class="pro-tag">PRO</span></a>
      <a class="nav-item" href="pricing-app.html" style="opacity:0.65;"><span class="nav-icon">🤖</span> AI feedback <span class="pro-tag">PRO</span></a>
      <a class="nav-item" href="pricing-app.html" style="opacity:0.65;"><span class="nav-icon">📄</span> Past papers <span class="pro-tag">PRO</span></a>
      <a class="nav-item" href="pricing-app.html" style="opacity:0.65;"><span class="nav-icon">📋</span> Mark schemes <span class="pro-tag">PRO</span></a>
    </div>

    <div class="nav-section" style="margin-top:8px;">
      <div class="nav-label">Account</div>
      <a class="nav-item" href="auth/setup.html"><span class="nav-icon">✏️</span> Edit subjects</a>
      <a class="nav-item" href="contact-app.html"><span class="nav-icon">✉️</span> Contact us</a>
      <a class="nav-item" href="settings.html"><span class="nav-icon">⚙</span> Settings</a>
    </div>`;

  const teacherMenu = `
    <div class="nav-section">
      <div class="nav-label">Menu</div>
      <a class="nav-item" href="teacher.html"><span class="nav-icon">🧑‍🏫</span> Your classes</a>
    </div>

    <div class="nav-section" style="margin-top:8px;">
      <div class="nav-label">Classes</div>
      ${others}
    </div>

    <div class="nav-section" style="margin-top:8px;">
      <div class="nav-label">Account</div>
      <a class="nav-item" href="contact-app.html"><span class="nav-icon">✉️</span> Contact us</a>
      <a class="nav-item" href="settings.html"><span class="nav-icon">⚙</span> Settings</a>
    </div>`;

  document.getElementById('sidebar').innerHTML = `
    <a href="${home}" class="sidebar-logo">
      <img src="favicon.svg" alt="RAG Learning" class="logo-img" />
      <div class="logo-text">RAG Learning</div>
    </a>
    ${isTeacher ? teacherMenu : studentMenu}
    <div class="sidebar-bottom">
      <div class="user-chip">
        <div class="avatar" id="avatarInitials" onclick="location.href='settings.html'" style="cursor:pointer">${esc(initials)}</div>
        <div class="user-info" onclick="location.href='settings.html'" style="cursor:pointer">
          <div class="user-name">${esc((fn + ' ' + ln).trim() || 'Account')}</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Sign out">⏻</button>
      </div>

async function loadTeacher() {
  const [rosterRes, heatRes, topicList, assignRes, progRes, mineRes] = await Promise.all([
    supabaseClient.rpc('class_roster',  { p_class_id: CLASS_ID }),
    supabaseClient.rpc('class_heatmap', { p_class_id: CLASS_ID }),
    loadTopics(klass.subject, klass.exam_board, klass.level),
    supabaseClient.from('assignments').select('*')
      .eq('class_id', CLASS_ID).order('created_at', { ascending: false }),
    supabaseClient.rpc('class_assignment_progress', { p_class_id: CLASS_ID }),
    supabaseClient.from('classes').select('id, name, subject, exam_board, archived')
      .eq('archived', false).order('created_at', { ascending: false })
  ]);

  roster        = rosterRes.data || [];
  heatmap       = heatRes.data   || [];
  topics        = topicList;
  assignments   = assignRes.data || [];
  assignProgress = progRes.data  || [];

  renderSidebar((mineRes.data || []).map(c => ({
    id: c.id, name: c.name, subject: c.subject, sub: c.exam_board
  })));

  // The bank may not exist for this spec yet. Fall back to whatever topics
  // the students' own data mentions, so the page still says something.
  if (!topics.length) {
    topics = [...new Set(heatmap.map(h => h.topic))].map(id => ({ id, name: id }));
  }

  renderTeacher();
}

/* One (student, topic) record, or null. */
function cellFor(studentId, topicId) {
  return heatmap.find(h => h.student_id === studentId && h.topic === topicId) || null;
}

/* Measured beats self-rated: a score is evidence, a self-rating is a guess. */
function effectiveRag(h) {
  if (!h) return null;
  return h.measured_rag || h.self_rag || null;
}

function cellClass(h) {
  if (!h) return 'none';
  if (h.measured_rag) return 'm-' + h.measured_rag;
  if (h.self_rag)     return 's-' + h.self_rag;
  return 'none';
}

function cellTitle(studentName, topicName, h) {
  if (!h) return `${studentName} — ${topicName}\nNot started`;
  const lines = [`${studentName} — ${topicName}`];
  if (h.measured_rag) {
    lines.push(`${h.measured_rag.toUpperCase()} — ${h.avg_pct}% over last ${h.attempts} attempt${h.attempts === 1 ? '' : 's'}`);
    if (h.last_attempt_at) lines.push(`Last attempt ${fmtDate(h.last_attempt_at)}`);
  } else if (h.self_rag) {
    lines.push(`${h.self_rag.toUpperCase()} — self-rated, no practice yet`);
  }
  return lines.join('\n');
}

/* Per-topic counts for the ranked list. Measured and self-rated are kept
 * apart: five students who have failed a topic is a different problem from
 * five who reckon they're shaky on it. */
function topicSummary(topicId) {
  const s = { mRed: 0, mAmber: 0, mGreen: 0, sRed: 0, sAmber: 0, sGreen: 0, none: 0 };
  for (const st of roster) {
    const h = cellFor(st.student_id, topicId);
    if (!h)                  { s.none++; continue; }
    if (h.measured_rag)      { s['m' + cap(h.measured_rag)]++; }
    else if (h.self_rag)     { s['s' + cap(h.self_rag)]++; }
    else                     { s.none++; }
  }
  return s;
}

function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }

/* Rank worst first. Measured reds are weighted hardest because they are the
 * only signal backed by evidence; not-started is excluded entirely — it is a
 * blind spot, not a weakness, and gets its own column instead. */
function topicScore(s) {
  return s.mRed * 3 + s.sRed * 2 + s.mAmber * 1.5 + s.sAmber;
}

 * topic_progress row or a practice attempt for it stamped after the
 * assignment was set, whether or not they came via the link.

function renderAssignment(a) {

async function saveAssignment() {
  const btn  = document.getElementById('assignBtn');

  const picked = [...document.querySelectorAll('.tpick:checked')].map(cb => cb.value);

  if (!picked.length) { msg.textContent = 'Pick at least one topic.'; return; }

  const due  = document.getElementById('aDue').value;

  const kind = document.querySelector('input[name="akind"]:checked')?.value || 'practice';

  btn.disabled = true; btn.textContent = 'Setting…';
  const { error } = await supabaseClient.from('assignments').insert({
    class_id: CLASS_ID,
    kind,
    topics: picked,

function renderOverview() {
  const ranked = topics
    .map(t => ({ ...t, s: topicSummary(t.id) }))
    .sort((a, b) => topicScore(b.s) - topicScore(a.s));

  const withData = heatmap.filter(h => h.measured_rag).length;
  const allPcts  = heatmap.filter(h => h.avg_pct != null).map(h => h.avg_pct);
  const avgPct   = allPcts.length ? Math.round(allPcts.reduce((a, b) => a + b, 0) / allPcts.length) : null;
  const covered  = topics.length
    ? Math.round(100 * ranked.filter(r => r.s.none < roster.length).length / topics.length) : 0;
  const slipping = roster.filter(isSlipping).length;

  return `
    <div class="stats">
      <div class="stat"><div class="stat-value">${avgPct == null ? '—' : avgPct + '%'}</div><div class="stat-label">Class average score</div></div>
      <div class="stat"><div class="stat-value">${covered}%</div><div class="stat-label">Of spec attempted</div></div>
      <div class="stat"><div class="stat-value">${withData}</div><div class="stat-label">Topics with real scores</div></div>
      <div class="stat"><div class="stat-value">${slipping}</div><div class="stat-label">Students to check on</div></div>
    </div>

    <div class="card">
      <h2>Where to aim the next lesson</h2>
      <p class="card-sub">Ranked by how many students are struggling, weighted towards topics where we have actual scores rather than self-ratings.</p>
      <div class="topic-row head-row"><div>Topic</div><div>Class</div><div>Not started</div></div>
      ${ranked.map(r => `
        <div class="topic-row" onclick="showTopic('${esc(r.id)}')">
          <div class="topic-name"><span class="tid">${esc(r.id)}</span>${esc(r.name)}</div>
          ${bar(r.s)}
          <div class="topic-count">${r.s.none}/${roster.length}</div>
        </div>`).join('')}
      <p class="muted-note">Not started is a blind spot, not a weakness — it isn't counted in the ranking.</p>
    </div>`;
}

function bar(s) {
  const total = Math.max(1, roster.length);
  const seg = (n, cls) => n ? `<span class="${cls}" style="width:${(100 * n / total).toFixed(2)}%"></span>` : '';
  return `<div class="bar">
    ${seg(s.mRed + s.sRed, 'b-red')}
    ${seg(s.mAmber + s.sAmber, 'b-amber')}
    ${seg(s.mGreen + s.sGreen, 'b-green')}
    ${seg(s.none, 'b-none')}

}

function renderGrid() {

          </tr>

        <tbody>
          ${topics.map(t => `
            <tr>
              <td class="tname" onclick="showTopic('${esc(t.id)}')" title="${esc(t.name)}">${esc(t.name)}</td>
              ${roster.map(st => {

/* Three independent reasons to look at a student. Which one fired matters —
 * "hasn't logged in for 12 days" and "scores are falling" need completely
 * different conversations — so the flag says which, never a single score. */
function slipReasons(st) {
  const out = [];
  const days = daysSince(st.last_active);
  if (days == null)   out.push('No activity yet');
  else if (days > 10) out.push(`Quiet ${days} days`);

  const theirs = heatmap.filter(h => h.student_id === st.student_id);
  const reds   = theirs.filter(h => h.measured_rag === 'red').length;
  if (reds >= 3) out.push(`${reds} red topics`);

  const scored = theirs.filter(h => h.avg_pct != null);
  if (scored.length >= 3) {
    const avg = scored.reduce((a, b) => a + b.avg_pct, 0) / scored.length;
    if (avg < 45) out.push(`Averaging ${Math.round(avg)}%`);
  }
  return out;
}

function isSlipping(st) { return slipReasons(st).length > 0; }

function renderStudents() {
  const rows = [...roster].sort((a, b) => slipReasons(b).length - slipReasons(a).length);
  return `
    <div class="card">
      <h2>Students</h2>
      <p class="card-sub">Flags say what to look at, not how worried to be. Anyone joining with the code appears here — remove anyone who shouldn't be.</p>
      <div class="roster-row head-row"><div>Name</div><div>Needs a look</div><div>Last active</div><div></div></div>
      ${rows.map(st => {
        const reasons = slipReasons(st);
        return `
          <div class="roster-row">
            <div><a href="#" onclick="showStudent('${esc(st.student_id)}');return false;">${esc(st.student_name || 'Unnamed')}</a></div>
            <div>${reasons.length
              ? `<span class="flag">${esc(reasons[0])}</span>`
              : `<span class="flag ok">Looks fine</span>`}</div>
            <div style="color:var(--muted);font-size:12px;">${st.last_active ? fmtDate(st.last_active) : 'Never'}</div>
            <div style="text-align:right;"><button class="link-btn" onclick="removeStudent('${esc(st.student_id)}','${esc(st.student_name)}')">Remove</button></div>
          </div>`;
      }).join('')}
    </div>

    ${klass.archived ? '' : `
      <div class="card">
        <h2>Finished with this class?</h2>
        <p class="card-sub">Archiving stops the join code working and takes it off your list. Nothing is deleted and you can reopen it — use this at the end of a year rather than deleting.</p>
        <button class="btn btn-danger" onclick="setArchived(true)">Archive ${esc(klass.name)}</button>
      </div>`}`;
}

function showTopic(topicId) {
  const t = topics.find(x => x.id === topicId) || { id: topicId, name: topicId };
  const groups = { red: [], amber: [], green: [], none: [] };
  for (const st of roster) {
    const h = cellFor(st.student_id, topicId);
    const r = effectiveRag(h);
    groups[r || 'none'].push({ name: st.student_name, measured: !!h?.measured_rag, pct: h?.avg_pct });
  }

  const group = (key, label) => groups[key].length ? `
    <p class="card-sub" style="margin:16px 0 8px;font-weight:600;color:var(--text);">${label} — ${groups[key].length}</p>
    <div class="chip-list">${groups[key].map(s =>
      `<span class="chip ${key === 'none' ? '' : key}">${esc(s.name)}${s.pct != null ? ` · ${s.pct}%` : (key === 'none' ? '' : ' · self-rated')}</span>`
    ).join('')}</div>` : '';

  document.getElementById('tabBody').innerHTML = `
    <div class="card">
      <div class="detail-head">
        <div>
          <h2>${esc(t.name)}</h2>
          <p class="card-sub" style="margin:0;">${esc(t.id)} · across ${roster.length} student${roster.length === 1 ? '' : 's'}</p>
        </div>
        <button class="btn btn-outline" onclick="renderTab()">← Back</button>
      </div>
      ${group('red', 'Struggling')}
      ${group('amber', 'Shaky')}
      ${group('green', 'Secure')}
      ${group('none', 'Not started')}
      <p class="muted-note">A percentage means we have practice scores. "self-rated" means they set the colour themselves and haven't attempted questions yet.</p>
    </div>`;
}

function showStudent(studentId) {
  const st = roster.find(s => s.student_id === studentId);
  if (!st) return;
  const theirs = topics.map(t => ({ t, h: cellFor(studentId, t.id) }));
  const reasons = slipReasons(st);

  const section = (label, filterFn) => {
    const list = theirs.filter(x => filterFn(x.h));
    if (!list.length) return '';
    return `
      <p class="card-sub" style="margin:16px 0 8px;font-weight:600;color:var(--text);">${label} — ${list.length}</p>
      <div class="chip-list">${list.map(({ t, h }) =>
        `<span class="chip ${effectiveRag(h) || ''}">${esc(t.name)}${h?.avg_pct != null ? ` · ${h.avg_pct}%` : ''}</span>`
      ).join('')}</div>`;
  };

  document.getElementById('tabBody').innerHTML = `
    <div class="card">
      <div class="detail-head">
        <div>
          <h2>${esc(st.student_name || 'Unnamed')}</h2>
          <p class="card-sub" style="margin:0;">
            Last active ${st.last_active ? fmtDate(st.last_active) : 'never'}
            ${reasons.length ? ' · ' + reasons.map(r => `<span class="flag">${esc(r)}</span>`).join(' ') : ''}
          </p>
        </div>
        <button class="btn btn-outline" onclick="renderTab()">← Back</button>
      </div>
      ${section('Struggling', h => effectiveRag(h) === 'red')}
      ${section('Shaky',      h => effectiveRag(h) === 'amber')}
      ${section('Secure',     h => effectiveRag(h) === 'green')}
      ${section('Not started', h => !effectiveRag(h))}
      <p class="muted-note">Scores and topic colours only. Written answers and AI feedback stay private to the student.</p>
    </div>`;
}

/* Rotating replaces the code and nothing else — existing members keep their
 * membership. One leak shouldn't cost thirty students their place; the
 * teacher removes the strangers from the roster instead. */
async function rotateCode() {
  if (!confirm(
    `Generate a new join code for ${klass.name}?\n\n` +
    `The old code stops working immediately, so anyone who hasn't joined yet ` +
    `will need the new one. Students already in the class stay in.`
  )) return;

  const { data, error } = await supabaseClient.rpc('rotate_join_code', { p_class_id: CLASS_ID });
  if (error) { alert('Could not change the code: ' + error.message); return; }

  klass.join_code = data;
  document.getElementById('codeValue').textContent = data;
}

async function copyJoinCode() {
  const btn = document.getElementById('copyCodeBtn');
  try {
    await navigator.clipboard.writeText(klass.join_code);
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
  } catch {
    btn.textContent = 'Press ⌘C';
  }
}

/* Archiving is the reversible version of deleting: the code stops working
 * and the class leaves the teacher's list, but every membership and all the
 * data stays, so an archived class can be reopened intact. */
async function setArchived(on) {
  if (on && !confirm(
    `Archive ${klass.name}?\n\n` +
    `The join code stops working and it leaves your class list. Nothing is ` +
    `deleted — you can reopen it any time.`
  )) return;

  const { error } = await supabaseClient
    .from('classes').update({ archived: on }).eq('id', CLASS_ID);
  if (error) { alert('Could not update: ' + error.message); return; }

  klass.archived = on;
  await loadTeacher();
}

async function removeStudent(studentId, name) {
  if (!confirm(`Remove ${name} from ${klass.name}?\n\nTheir own work is untouched — you just stop seeing it.`)) return;
  const { error } = await supabaseClient
    .from('class_members').delete()
    .eq('class_id', CLASS_ID).eq('student_id', studentId);
  if (error) { alert('Could not remove: ' + error.message); return; }
  await loadTeacher();
}

/* ═══ STUDENT ═════════════════════════════════════════════════════════ */
async function loadStudent() {
  const [progRes, attRes, topicList, workRes] = await Promise.all([
    supabaseClient.from('topic_progress')
      .select('topic, rag_status, updated_at')
      .eq('user_id', me.id).eq('subject', klass.subject).eq('exam_board', klass.exam_board),
    supabaseClient.from('practice_attempts')
      .select('topic, pct, taken_at')
      .eq('user_id', me.id).eq('subject', klass.subject).eq('exam_board', klass.exam_board)
      .order('taken_at', { ascending: false }),
    loadTopics(klass.subject, klass.exam_board, klass.level),
    supabaseClient.rpc('my_assignments')
  ]);

  renderSidebar([]);   // classes-nav.js fills in the Classes section

  const prog = progRes.data || [], atts = attRes.data || [];
  const work = (workRes.data || []).filter(w => w.class_id === CLASS_ID);
  topics = topicList.length ? topicList
    : [...new Set([...prog.map(p => p.topic), ...atts.map(a => a.topic)])].map(id => ({ id, name: id }));

  // Same rule the teacher's grid uses — mean of the three most recent
  // attempts — so the student sees exactly the colour their teacher sees.
  const byTopic = {};
  for (const a of atts) (byTopic[a.topic] ||= []).push(a.pct);

  const rows = topics.map(t => {
    const pcts = (byTopic[t.id] || []).slice(0, 3);
    const avg  = pcts.length ? Math.round(pcts.reduce((x, y) => x + y, 0) / pcts.length) : null;
    const self = prog.find(p => p.topic === t.id)?.rag_status || null;
    const measured = avg == null ? null : avg >= 70 ? 'green' : avg >= 40 ? 'amber' : 'red';
    return { t, avg, self, rag: measured || self };
  });

  const section = (label, key) => {
    const list = rows.filter(r => r.rag === key || (key === null && !r.rag));
    if (!list.length) return '';
    return `
      <p class="card-sub" style="margin:16px 0 8px;font-weight:600;color:var(--text);">${label} — ${list.length}</p>
      <div class="chip-list">${list.map(r =>
        `<span class="chip ${r.rag || ''}">${esc(r.t.name)}${r.avg != null ? ` · ${r.avg}%` : ''}</span>`
      ).join('')}</div>`;
  };

  document.getElementById('root').innerHTML = `
    <a class="back" href="Dashboard.html">← Back to dashboard</a>
    <div class="head">
      <div>
        <div class="head-emoji">${esc(subjEmoji(klass.subject))}</div>
        <h1>${esc(klass.name)}</h1>
        <div class="head-meta">${esc(klass.subject)} · ${esc(klass.exam_board)} · ${levelLabel(klass.level)} · ${esc(klass.teacher_name || 'Your teacher')}</div>
      </div>
    </div>

    ${renderStudentWork(work)}

    <div class="card">
      <h2>What ${esc(firstWord(klass.teacher_name) || 'your teacher')} can see</h2>
      <p class="card-sub">Exactly this — your topic colours and practice scores for ${esc(klass.subject)}. Not your written answers, not your AI feedback, and nothing from your other subjects.</p>
      ${section('Struggling', 'red')}
      ${section('Shaky', 'amber')}
      ${section('Secure', 'green')}
      ${section('Not started', null)}
      ${rows.every(r => !r.rag) ? '<div class="empty">Nothing tracked yet — take a diagnostic or some practice questions and it will show up here.</div>' : ''}
    </div>

    <div class="card">
      <h2>Leave this class</h2>
      <p class="card-sub">Your teacher stops seeing your work straight away. Nothing of yours is deleted, and you can rejoin with the code.</p>
      <button class="btn btn-danger" onclick="leaveClass()">Leave ${esc(klass.name)}</button>
    </div>`;
}

/* Work set for this student, with a link straight into the first topic they
 * still owe. Practice has no topic deep-link yet, so those land on the
 * practice page and the student picks the topic themselves. */
function renderStudentWork(work) {
  if (!work.length) return '';

  return `
    <div class="card">
      <h2>Set by ${esc(firstWord(klass.teacher_name) || 'your teacher')}</h2>
      <p class="card-sub">This ticks off automatically as you cover each topic — there's nothing to hand in.</p>
      ${work.map(w => {
        const remaining = w.total_topics - w.done_topics;
        const complete  = remaining <= 0;
        const over      = w.due_at && new Date(w.due_at) < new Date() && !complete;
        const pct       = w.total_topics ? Math.round(100 * w.done_topics / w.total_topics) : 0;
        const names     = topicNamesFor(w.topics);
        const nextId    = w.topics[Math.min(w.done_topics, w.topics.length - 1)];
        const page      = w.kind === 'diagnostic'
          ? window.diagnosticPageFor?.(w.subject, w.exam_board, w.level)
          : 'practice.html';
        const href = w.kind === 'diagnostic' && page
          ? `${page}?topic=${encodeURIComponent(nextId)}`
          : 'practice.html';

        return `
          <div style="border:1px solid var(--border);border-radius:11px;padding:16px;margin-bottom:12px;">
            <div class="detail-head" style="margin-bottom:10px;">
              <div style="min-width:0;">
                <div style="font-size:14px;font-weight:600;">
                  ${w.kind === 'diagnostic' ? '🚦 Diagnostic' : '✦ Practice questions'}
                  ${complete ? '<span class="flag ok" style="margin-left:8px;">Done</span>'
                    : w.due_at ? `<span class="flag" style="margin-left:8px;">${over ? 'Overdue' : 'Due'} ${fmtDate(w.due_at)}</span>` : ''}
                </div>
                <div class="card-sub" style="margin:4px 0 0;">${esc(names.join(' · '))}</div>
                ${w.note ? `<div class="card-sub" style="margin:6px 0 0;font-style:italic;">"${esc(w.note)}"</div>` : ''}
              </div>
              ${complete ? '' : `<a class="btn btn-outline" href="${esc(href)}" style="text-decoration:none;white-space:nowrap;">Start</a>`}
            </div>
            <div class="bar" style="height:8px;">
              <span class="b-green" style="width:${pct}%"></span>
              <span class="b-none" style="width:${100 - pct}%"></span>
            </div>
            <div class="card-sub" style="margin:8px 0 0;">
              ${w.done_topics} of ${w.total_topics} topics covered${complete ? '' : ` — ${remaining} to go`}
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

async function leaveClass() {
  if (!confirm(`Leave ${klass.name}?\n\nYour teacher will stop seeing your work. You can rejoin with the code.`)) return;
  const { error } = await supabaseClient
    .from('class_members').delete()
    .eq('class_id', CLASS_ID).eq('student_id', me.id);
  if (error) { alert('Could not leave: ' + error.message); return; }
  location = 'Dashboard.html';
}

/* ═══ Helpers ═════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function subjEmoji(name) { return window.SUBJECTS_CONFIG?.emojiFor(name) || '📚'; }
function levelLabel(l)   { return l === 'gcse' ? 'GCSE' : l === 'as' ? 'AS' : 'A-Level'; }
function firstWord(s)    { return (s || '').trim().split(/\s+/)[0] || ''; }
function shortName(s) {
  const parts = (s || '').trim().split(/\s+/);
  if (!parts[0]) return '?';
  return parts.length > 1 ? `${parts[0]} ${parts[1][0]}` : parts[0];
}
function daysSince(ts) {
  if (!ts) return null;
  return Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
}
function fmtDate(ts) {
  const d = daysSince(ts);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 30)  return `${d} days ago`;
  return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
