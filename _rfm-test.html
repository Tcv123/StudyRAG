<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>referral modal harness</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
<script>
  // Stub Supabase: no attribution row, records the insert payload.
  window.__inserted = null;
  window.supabaseClient = {
    auth: { getSession: async () => ({ data: { session: { user: { id: 'stub-user-id' } } } }) },
    from: function () {
      return {
        select: () => ({ eq: () => ({ maybeSingle: async () => ({ data: null, error: null }) }) }),
        insert: async (payload) => { window.__inserted = payload; return { error: null }; }
      };
    }
  };
</script>
<script src="referral-modal.js"></script>
</head>
<body style="font-family:var(--font-body);padding:40px;background:var(--bg);color:var(--text)">
  <h1 style="font-family:var(--font-display)">Page behind the modal</h1>
  <p>If you can read this without a blocking overlay, something is wrong.</p>
</body>
</html>
