# Cloudflare Pages config. Build command and secrets are set in the Pages
# dashboard; this file only pins the runtime the /api functions need.
name = "raglearning"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
# Buffer, crypto and process.env for the api/ handlers and their npm packages.
compatibility_flags = ["nodejs_compat"]

# Plain (non-secret) settings for the /api functions. Secret keys are set in
# the Pages dashboard under Settings -> Variables and secrets, never here:
# this repo is public.
[vars]
# Already public: the pages use it in supabase-config.js.
SUPABASE_URL = "https://tfpnagnjnzmlgbnqeiwr.supabase.co"
# Stripe price ids for RAG Pro. TEST MODE: swap all three for the live-mode
# ids (and the Stripe secrets in the dashboard) when payments go live.
STRIPE_PRICE_ID_MONTHLY = "price_1ULNSGGz8hIl88D9bmYikJYA"   # £9.99 / month
STRIPE_PRICE_ID_BIANNUAL = "price_1ULNTyGz8hIl88D9jHvubKqF"  # £56.00 / 6 months
STRIPE_PRICE_ID_ANNUAL = "price_1ULNUNGz8hIl88D9vu03KIZi"    # £100.00 / year
