# Cloudflare Pages config. Build command and secrets are set in the Pages
# dashboard; this file only pins the runtime the /api functions need.
name = "raglearning"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
# Buffer, crypto and process.env for the api/ handlers and their npm packages.
compatibility_flags = ["nodejs_compat"]

# Plain (non-secret) settings for the /api functions. Secret keys are set in
# the Pages dashboard under Settings -> Variables and secrets, never here:
# this repo is public.
[vars]
# Already public: the pages use it in supabase-config.js.
SUPABASE_URL = "https://tfpnagnjnzmlgbnqeiwr.supabase.co"
# Stripe price ids for RAG Pro. LIVE MODE: these only work with the sk_live_
# key in the dashboard. The old sandbox ids were price_1ULNSG..., 1ULNTy...
# and 1ULNUN..., if a test deploy ever needs them back.
STRIPE_PRICE_ID_MONTHLY = "price_1UTfQMGz8hIl88D9h5wJSzMS"   # £9.99 / month
STRIPE_PRICE_ID_BIANNUAL = "price_1UTfQyGz8hIl88D9MZqalX2A"  # £56.00 / 6 months
STRIPE_PRICE_ID_ANNUAL = "price_1UTfQlGz8hIl88D9PdmMXeAf"    # £100.00 / year
